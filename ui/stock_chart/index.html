<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/css/stocktools/gui.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/css/annotations/popup.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Source Sans Pro", "Source Sans", system-ui, sans-serif; }
  #chart { width: 100%; }
  #chart.axis-drag, #chart.axis-drag * { cursor: ew-resize !important; }
  #chart.yaxis-drag, #chart.yaxis-drag * { cursor: ns-resize !important; }
  #bar { height: 24px; line-height: 24px; font-size: 13px; padding-left: 48px; display: flex; gap: 12px; align-items: center; }
  #status { opacity: 0.75; flex: 1; }
  #status.error { color: #dc2626; opacity: 1; }
  #fullscreen, #logscale, #snapshot { font: inherit; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 4px; border: 1px solid currentColor;
    background: transparent; color: inherit; opacity: 0.75; cursor: pointer; margin-right: 8px; }
  #fullscreen:hover, #logscale:hover, #snapshot:hover { opacity: 1; }
  #snapshot:disabled { opacity: 0.4; cursor: default; }
  #logscale.on { opacity: 1; font-weight: 600; }
  #fatal { padding: 24px; font-size: 15px; }
  .hc-info { font-size: 12px; line-height: 1.45; white-space: nowrap; }
  .hc-info b { font-weight: 600; }
  .hc-info .up { color: #16a34a; } .hc-info .down { color: #dc2626; }
  .hc-info .dim { opacity: 0.7; }
</style>
</head>
<body>
<div id="chart"></div>
<div id="bar"><span id="status"></span><button id="snapshot" type="button" title="Lagre chartet med tegninger som bilde til et notat">📷 Bilde til notat</button><button id="logscale" type="button" title="Bytt mellom lineær og logaritmisk kursakse">Log</button><button id="fullscreen" type="button" title="Vis grafen i fullskjerm (Esc for å avslutte)">⛶ Fullskjerm</button></div>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/highstock.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/highcharts-more.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/modules/drag-panes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/modules/annotations-advanced.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/modules/price-indicator.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/modules/stock-tools.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/modules/mouse-wheel-zoom.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/indicators/indicators.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/indicators/volume-by-price.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.6.2/modules/exporting.js"></script>
<script>
(function () {
  const ICONS = "https://cdn.jsdelivr.net/npm/highcharts@12.6.2/gfx/stock-icons/";
  const UP = "#16a34a", DOWN = "#dc2626", AMBER = "#d97706", BLUE = "#2563eb";
  const OVERSCROLL = 45 * 24 * 3600 * 1000; // ca. 45 dager tomrom etter siste kurs
  const statusEl = document.getElementById("status");
  const chartEl = document.getElementById("chart");

  let chart = null;        // gjeldende Highcharts-graf
  let chartKey = null;     // hvilke data grafen er bygget fra
  let ticker = null;
  let canSave = false;
  let lastSaved = "[]";    // tegningene slik de sist ble sendt til lagring
  let pendingNonce = null; // lagring vi venter bekreftelse på
  let mouseDown = false;
  let baseHeight = 0;      // høyde fra Streamlit (utenfor fullskjerm)
  let fullscreen = false;
  let logScale = localStorage.getItem("chart_log") === "1";

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  function num(value, decimals) {
    return Number(value).toLocaleString("nb-NO", {
      minimumFractionDigits: decimals, maximumFractionDigits: decimals,
    });
  }

  function day(ms) {
    return new Date(ms).toLocaleDateString("nb-NO", { timeZone: "UTC" });
  }

  function drawings() {
    return chart.annotations.map(function (annotation) { return annotation.userOptions; });
  }

  function palette(theme) {
    const dark = !!theme && theme.base === "dark";
    return {
      dark: dark,
      bg: (theme && theme.backgroundColor) || (dark ? "#0e1117" : "#ffffff"),
      text: (theme && theme.textColor) || (dark ? "#fafafa" : "#31333f"),
      grid: dark ? "#262b36" : "#e9ecf1",
      line: dark ? "#3a4150" : "#cfd4dc",
      panel: (theme && theme.secondaryBackgroundColor) || (dark ? "#262730" : "#f0f2f6"),
    };
  }

  // Highcharts tegner som standard i svart, som ikke synes på mørk bakgrunn. Her byttes alle
  // mørke standardfarger for tegninger ut med en farge som passer temaet. Farger du velger
  // selv i tegningens innstillinger, beholdes.
  const DARK_DEFAULT = /^(rgba\(0, 0, 0, 0\.75\)|#000000|#333333|#666666|black)$/;
  let drawingSlots = null;

  function applyDrawingColor(p) {
    const color = p.dark ? "#22d3ee" : "#0e7490";
    const fill = p.dark ? "rgba(34,211,238,0.18)" : "rgba(14,116,144,0.15)";
    if (drawingSlots === null) {
      drawingSlots = [];
      (function walk(node) {
        Object.keys(node).forEach(function (key) {
          const value = node[key];
          if (value && typeof value === "object") { walk(value); }
          else if (typeof value === "string" && DARK_DEFAULT.test(value)) { drawingSlots.push([node, key]); }
        });
      })(Highcharts.getOptions().annotations);
    }
    drawingSlots.forEach(function (slot) { slot[0][slot[1]] = slot[1] === "fill" ? fill : color; });
  }

  function buildChart(args, theme) {
    const p = palette(theme);
    const root = document.documentElement;
    root.classList.toggle("highcharts-dark", p.dark);
    root.classList.toggle("highcharts-light", !p.dark);
    root.style.setProperty("--highcharts-background-color", p.bg);
    root.style.setProperty("--highcharts-neutral-color-3", p.panel);
    root.style.setProperty("--highcharts-neutral-color-10", p.line);
    root.style.setProperty("--highcharts-neutral-color-20", p.line);
    document.body.style.color = p.text;
    document.getElementById("chart").style.height = args.height + "px";

    const lastX = args.ohlc[args.ohlc.length - 1][0];
    const label = { style: { color: p.text } };

    // Oppslag for infoboksen: dag → indeks i kurs- og volumlistene.
    const indexByX = new Map();
    args.ohlc.forEach(function (row, i) { indexByX.set(row[0], i); });
    const volSma = new Map((args.vol_sma50 || []).map(function (v) { return [v[0], v[1]]; }));

    function pct(value, cls) {
      const sign = value > 0 ? "+" : "";
      return '<span class="' + (cls || (value >= 0 ? "up" : "down")) + '">' + sign + num(value, 2) + " %</span>";
    }

    // Én kompakt linje med OHLC, endring, volum og glidende snitt for dagen under musa.
    function infoBox(points, x) {
      const i = indexByX.get(x);
      if (i === undefined) { return false; }
      const row = args.ohlc[i];
      const prev = i > 0 ? args.ohlc[i - 1][4] : null;
      const chg = prev ? (row[4] / prev - 1) * 100 : null;
      const volume = args.volume[i] ? args.volume[i][1] : null;
      const sma = volSma.get(x);
      let html = '<div class="hc-info"><b>' + day(x) + "</b>" +
        ' <span class="dim">Å</span> ' + num(row[1], 2) + ' <span class="dim">H</span> ' + num(row[2], 2) +
        ' <span class="dim">L</span> ' + num(row[3], 2) + ' <span class="dim">S</span> <b>' + num(row[4], 2) + "</b>";
      if (chg !== null) { html += " " + pct(chg); }
      if (volume !== null) {
        html += ' &nbsp;<span class="dim">Vol</span> ' + num(volume, 0);
        if (sma) { html += ' <span class="dim">(' + num(volume / sma, 1) + "× SMA50)</span>"; }
      }
      const lines = [];
      points.forEach(function (pt) {
        if (pt.series.type === "line" && pt.series.name.indexOf("SMA") === 0 && pt.series.yAxis === chart.yAxis[0]) {
          lines.push('<span style="color:' + pt.series.color + '">' + pt.series.name + "</span> " + num(pt.y, 2) +
            ' <span class="dim">' + pct((row[4] / pt.y - 1) * 100, "dim") + "</span>");
        } else if (pt.series.type === "arearange") {
          lines.push('<span style="color:' + pt.series.color + '">BB</span> ' + num(pt.low, 2) + "–" + num(pt.high, 2));
        } else if (pt.series.type === "line" && pt.series.yAxis && pt.series.yAxis.options.title && pt.series.yAxis.options.title.text) {
          lines.push('<span style="color:' + pt.series.color + '">' + pt.series.name + "</span> " + num(pt.y, 2));
        }
      });
      if (lines.length) { html += "<br>" + lines.join(" &nbsp; "); }
      return html + "</div>";
    }

    const series = [
      {
        type: "candlestick", id: "price", name: args.title, data: args.ohlc, showInLegend: false,
        color: DOWN, lineColor: DOWN, upColor: UP, upLineColor: UP, zIndex: 3,
      },
      ...(args.smas || []).map(function (s) {
        return { type: "line", name: "SMA" + s.period, data: s.data, color: s.color, lineWidth: 1.3, zIndex: 2 };
      }),
      { type: "line", id: "pivots", name: "Pivoter", data: [], color: p.text },
    ];

    // Én kort vannrett strek per brutt pivot: fra pivot-toppen til bruddagen.
    args.breakouts.forEach(function (b) {
      series.push({
        type: "line", linkedTo: "pivots", data: [[b.pivot_x, b.pivot], [b.x, b.pivot]],
        color: b.with_volume ? UP : AMBER, lineWidth: 1.5, enableMouseTracking: false, zIndex: 4,
      });
    });
    if (args.active_pivot) {
      series.push({
        type: "line", linkedTo: "pivots", dashStyle: "Dash", color: p.text, lineWidth: 1.5,
        enableMouseTracking: false, zIndex: 4,
        data: [[args.active_pivot.x, args.active_pivot.price], [lastX, args.active_pivot.price]],
        dataLabels: {
          enabled: true, align: "right", verticalAlign: "bottom", y: -2,
          style: { color: p.text, textOutline: "none", fontWeight: "600" },
          formatter: function () {
            return this.x === lastX ? "Pivot " + num(args.active_pivot.price, 2) : null;
          },
        },
      });
    }

    function breakoutFlags(withVolume) {
      return args.breakouts.filter(function (b) { return b.with_volume === withVolume; }).map(function (b) {
        return {
          x: b.x, title: "B",
          text: "<b>Brudd " + (withVolume ? "med" : "uten") + " volum</b><br>Over pivot " + num(b.pivot, 2) +
            " fra " + day(b.pivot_x) + "<br>Relativt volum: " + num(b.rel_vol, 2),
        };
      });
    }
    series.push({
      type: "flags", name: "Brudd med volum", onSeries: "price", shape: "circlepin", data: breakoutFlags(true),
      color: UP, fillColor: UP, style: { color: "#ffffff" }, width: 14, zIndex: 6,
    });
    series.push({
      type: "flags", name: "Brudd uten volum", onSeries: "price", shape: "circlepin", data: breakoutFlags(false),
      color: AMBER, fillColor: p.bg, style: { color: AMBER }, width: 14, zIndex: 5,
    });

    // 7/7-perioder: grønt bånd i bakgrunnen og flagg ved start og slutt.
    // Bygges på nytt ved hver bruk: Highcharts endrer listen den får når bånd fjernes.
    function templateBands() {
      return args.periods.map(function (period) {
        return { id: "template", from: period[0], to: period[1] === null ? lastX : period[1], color: "rgba(22,163,74,0.10)" };
      });
    }
    const templateFlags = [];
    args.periods.forEach(function (period) {
      templateFlags.push({ x: period[0], title: "7/7", text: "<b>7/7 oppfylt</b><br>Fra " + day(period[0]), fillColor: UP, color: UP });
      if (period[1] !== null) {
        templateFlags.push({ x: period[1], title: "✕", text: "<b>Ikke lenger 7/7</b><br>Fra " + day(period[1]), fillColor: DOWN, color: DOWN });
      }
    });
    templateFlags.sort(function (a, b) { return a.x - b.x; });
    series.push({
      type: "flags", name: "7/7-perioder", shape: "squarepin", data: templateFlags, color: UP,
      style: { color: "#ffffff" }, y: -28, zIndex: 5,
      events: {
        hide: function () { this.chart.xAxis[0].removePlotBand("template"); },
        show: function () {
          const axis = this.chart.xAxis[0];
          axis.removePlotBand("template");
          templateBands().forEach(function (band) { axis.addPlotBand(band); });
        },
      },
    });

    // Egne handler: grønn pil opp for kjøp, rød pil ned for salg, på handelskursen.
    if (args.trades && args.trades.length) {
      const esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
      series.push({
        type: "scatter", name: "Handler", color: p.text, zIndex: 8, turboThreshold: 0,
        stickyTracking: false, dataGrouping: { enabled: false },
        marker: { enabled: true, radius: 7, lineWidth: 1.5, lineColor: p.bg },
        tooltip: { pointFormatter: function () { return this.text; } },
        data: args.trades.map(function (t) {
          const color = t.buy ? UP : DOWN;
          return {
            x: t.x, y: t.price, color: color,
            marker: { symbol: t.buy ? "triangle" : "triangle-down", fillColor: color },
            text: '<span style="color:' + color + '">\u25CF</span> <b>' + (t.buy ? "Kjøp" : "Salg") + "</b> " + day(t.date) +
              "<br>" + num(t.quantity, 0) + " stk til " + num(t.price, 2) +
              (t.fee ? "<br>Kurtasje: " + num(t.fee, 0) : "") +
              (t.comment ? "<br>" + esc(t.comment) : ""),
          };
        }),
      });
    }

    series.push({
      type: "column", id: "volume", name: "Volum", yAxis: 1, showInLegend: false, turboThreshold: 0,
      data: args.volume.map(function (v) { return { x: v[0], y: v[1], color: v[2] ? UP : DOWN }; }),
    });
    series.push({
      type: "line", name: "Volum SMA50", yAxis: 1, data: args.vol_sma50 || [], color: "#f59e0b",
      lineWidth: 1.3, zIndex: 2, tooltip: { valueDecimals: 0 },
    });

    // Indikatorer. Bollinger legges i prispanelet, RSI og ATR får egne paneler under volumet.
    const ind = args.indicators || {};
    const panels = []; // ekstra paneler: { id, name, data, color, bands }
    if (ind.bollinger) {
      const BB = p.dark ? "#a78bfa" : "#7c3aed";
      series.push({
        type: "arearange", name: "Bollinger", id: "bb", zIndex: 1, color: BB, lineWidth: 1, fillOpacity: 0.08,
        data: ind.bollinger.lower.map(function (lo, i) { return [lo[0], lo[1], ind.bollinger.upper[i][1]]; }),
      });
      series.push({ type: "line", name: "BB midt", linkedTo: "bb", data: ind.bollinger.mid, color: BB, lineWidth: 1, dashStyle: "ShortDot", zIndex: 1 });
    }
    if (ind.rsi) { panels.push({ name: "RSI 14", data: ind.rsi, color: p.dark ? "#f472b6" : "#db2777", min: 0, max: 100, lines: [30, 70] }); }
    if (ind.atr) { panels.push({ name: "ATR 14", data: ind.atr, color: p.dark ? "#34d399" : "#059669" }); }
    if (ind.vbp) {
      // Volum per kursnivå: vannrette stolper fra venstre kant, beregnet av Highcharts for synlig periode.
      series.push({
        type: "vbp", name: "Volum per kursnivå", linkedTo: "price", showInLegend: true, zIndex: 0,
        params: { volumeSeriesID: "volume", ranges: 24 },
        dataLabels: { enabled: false }, zoneLines: { enabled: false },
        volumeDivision: { enabled: true, styles: { positiveColor: "rgba(22,163,74,0.35)", negativeColor: "rgba(220,38,38,0.35)" } },
        enableMouseTracking: false,
      });
    }

    // Panelhøyder i prosent: pris, volum og eventuelle indikatorpaneler.
    const gap = 3, panelH = 14, volH = panels.length ? 14 : 21;
    const priceH = 100 - volH - gap - panels.length * (panelH + gap);
    const axisLabel = Object.assign({ align: "left", x: 6 }, label);
    const yAxes = [
      { height: priceH + "%", type: logScale ? "logarithmic" : "linear", labels: axisLabel, gridLineColor: p.grid, startOnTick: false, endOnTick: false, resize: { enabled: true, lineColor: p.line }, crosshair: { color: p.line, snap: false } },
      { top: (priceH + gap) + "%", height: volH + "%", labels: axisLabel, gridLineColor: p.grid, resize: { enabled: true, lineColor: p.line } },
    ];
    let top = priceH + gap + volH + gap;
    panels.forEach(function (panel, i) {
      yAxes.push({
        top: top + "%", height: panelH + "%", labels: axisLabel, gridLineColor: p.grid, min: panel.min, max: panel.max,
        title: { text: panel.name, align: "high", offset: 0, rotation: 0, y: 12, x: 4, textAlign: "left", style: { color: panel.color, fontSize: "11px" } },
        resize: { enabled: i < panels.length - 1, lineColor: p.line },
        plotLines: (panel.lines || []).map(function (v) { return { value: v, color: p.line, dashStyle: "Dash", width: 1 }; }),
      });
      series.push({ type: "line", name: panel.name, yAxis: yAxes.length - 1, data: panel.data, color: panel.color, lineWidth: 1.3, showInLegend: false });
      top += panelH + gap;
    });

    Highcharts.setOptions({
      lang: {
        rangeSelectorZoom: "",
        months: ["januar", "februar", "mars", "april", "mai", "juni", "juli", "august", "september", "oktober", "november", "desember"],
        shortMonths: ["jan", "feb", "mar", "apr", "mai", "jun", "jul", "aug", "sep", "okt", "nov", "des"],
        weekdays: ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"],
      },
    });

    applyDrawingColor(p);

    chart = Highcharts.stockChart("chart", {
      chart: {
        backgroundColor: p.bg, height: args.height, animation: false, style: { fontFamily: "inherit" },
        panning: { enabled: true, type: "x" },
        zooming: { mouseWheel: { enabled: true, type: "x", sensitivity: 1.2 } },
      },
      credits: { enabled: false },
      exporting: { enabled: false },
      exporting: { enabled: false },
      navigation: { iconsURL: ICONS },
      stockTools: {
        gui: {
          enabled: true, iconsURL: ICONS,
          buttons: ["lines", "crookedLines", "simpleShapes", "measure", "advanced", "verticalLabels",
            "separator", "toggleAnnotations", "zoomChange", "typeChange", "currentPriceIndicator"],
        },
      },
      rangeSelector: {
        selected: 2, inputEnabled: false,
        buttons: [
          { type: "month", count: 3, text: "3m" }, { type: "month", count: 6, text: "6m" },
          { type: "year", count: 1, text: "1 år" }, { type: "year", count: 2, text: "2 år" },
          { type: "all", text: "Alt" },
        ],
        buttonTheme: {
          width: 40, fill: p.panel, stroke: "none", r: 4, style: { color: p.text },
          states: {
            hover: { fill: p.line, style: { color: p.text } },
            select: { fill: BLUE, style: { color: "#ffffff", fontWeight: "600" } },
          },
        },
      },
      legend: { enabled: true, itemStyle: { color: p.text, fontWeight: "normal" }, itemHoverStyle: { color: p.text }, itemHiddenStyle: { color: p.line } },
      navigator: { maskFill: "rgba(37,99,235,0.15)", outlineColor: p.line, xAxis: { gridLineColor: p.grid, labels: label }, series: { color: BLUE, lineColor: BLUE } },
      scrollbar: { enabled: false },
      // overscroll: tomrom til høyre for siste kurs, så du kan panorere frem i tid og tegne der.
      xAxis: { plotBands: templateBands(), overscroll: OVERSCROLL, lineColor: p.line, tickColor: p.line, labels: label, crosshair: { color: p.line } },
      yAxis: yAxes,
      tooltip: {
        // Fast boks øverst til venstre i grafen, så den ikke dekker lyset eller tegningene.
        fixed: true, shared: true, split: false, useHTML: true, shadow: false, borderRadius: 6,
        position: { relativeTo: "plotBox", align: "left", verticalAlign: "top", x: 8, y: 6 },
        backgroundColor: p.dark ? "rgba(14,17,23,0.85)" : "rgba(255,255,255,0.9)", borderColor: p.line, style: { color: p.text },
        formatter: function () {
          const points = this.points || [this.point];
          const extra = points.filter(function (pt) { return pt.text; }).map(function (pt) { return pt.text; });
          const main = points.some(function (pt) { return pt.series.type === "candlestick"; }) ? infoBox(points, this.x) : "";
          if (!main && !extra.length) { return false; }
          return (main || "") + extra.map(function (t) { return '<div class="hc-info">' + t + "</div>"; }).join("");
        },
      },
      plotOptions: {
        series: { animation: false, dataGrouping: { enabled: false }, marker: { enabled: false } },
        flags: { useHTML: false, states: { hover: { fillColor: undefined } } },
      },
      series: series,
    });

    (args.annotations || []).forEach(function (options) {
      try { chart.addAnnotation(options); } catch (error) { console.warn("Kunne ikke gjenopprette tegning", error); }
    });
    lastSaved = JSON.stringify(drawings());
    pendingNonce = null;
    setStatus(canSave ? "Tegninger lagres automatisk." : "Tegninger lagres ikke – Supabase er ikke koblet til.");
    send("streamlit:setFrameHeight", { height: args.height + 26 });
    if (fullscreen) { resizeToWindow(); }
  }

  // Fullskjerm: komponenten ligger i en iframe på samme opphav, så vi kan legge selve iframen
  // over hele siden. Det virker uavhengig av om nettleseren tillater ekte fullskjerm i iframen.
  const frame = (function () { try { return window.frameElement; } catch (e) { return null; } })();
  const fsButton = document.getElementById("fullscreen");

  function resizeToWindow() {
    if (!chart) { return; }
    const height = Math.max(300, window.innerHeight - 26);
    document.getElementById("chart").style.height = height + "px";
    chart.setSize(undefined, height, false);
  }

  function setFullscreen(on) {
    if (on === fullscreen) { return; }
    fullscreen = on;
    if (frame) {
      if (on) {
        frame.dataset.prevStyle = frame.getAttribute("style") || "";
        frame.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;z-index:999999;";
        if (frame.ownerDocument && frame.ownerDocument.body) { frame.ownerDocument.body.style.overflow = "hidden"; }
      } else {
        frame.setAttribute("style", frame.dataset.prevStyle || "");
        if (frame.ownerDocument && frame.ownerDocument.body) { frame.ownerDocument.body.style.overflow = ""; }
      }
    } else if (document.fullscreenEnabled) {
      if (on) { document.documentElement.requestFullscreen().catch(function () {}); }
      else if (document.fullscreenElement) { document.exitFullscreen(); }
    }
    document.body.style.backgroundColor = on && chart ? chart.options.chart.backgroundColor : "";
    fsButton.textContent = on ? "✕ Avslutt fullskjerm (Esc)" : "⛶ Fullskjerm";
    if (on) { setTimeout(resizeToWindow, 50); }
    else if (chart) {
      document.getElementById("chart").style.height = baseHeight + "px";
      chart.setSize(undefined, baseHeight, false);
    }
  }

  fsButton.addEventListener("click", function () { setFullscreen(!fullscreen); });
  document.addEventListener("keydown", function (event) { if (event.key === "Escape" && fullscreen) { setFullscreen(false); } });
  window.addEventListener("resize", function () { if (fullscreen) { resizeToWindow(); } });
  document.addEventListener("fullscreenchange", function () { if (!document.fullscreenElement && fullscreen && !frame) { setFullscreen(false); } });
  if (!frame && !document.fullscreenEnabled) { fsButton.style.display = "none"; }

  function onRender(event) {
    const args = event.data.args;
    ticker = args.ticker;
    canSave = !!args.can_save;
    baseHeight = args.height;
    if (typeof Highcharts === "undefined") {
      document.body.innerHTML = '<div id="fatal">Kunne ikke laste Highcharts. Sjekk nettforbindelsen og last siden på nytt.</div>';
      send("streamlit:setFrameHeight", { height: 80 });
      return;
    }
    if (chart === null || chartKey !== args.chart_key) {
      if (chart) { chart.destroy(); chart = null; }
      chartKey = args.chart_key;
      buildChart(args, event.data.theme);
    }
    if (pendingNonce !== null && args.saved_nonce === pendingNonce) {
      pendingNonce = null;
      setStatus("Tegninger lagret kl. " + new Date().toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" }) + ".");
    } else if (pendingNonce !== null && args.error_nonce === pendingNonce) {
      pendingNonce = null;
      setStatus("Kunne ikke lagre tegningene. Endringen er ikke lagret.", true);
    }
  }

  // Lagrer automatisk når tegningene er endret (sjekkes når musa ikke holdes nede).
  function autosave() {
    if (!chart || !canSave || mouseDown) { return; }
    const current = JSON.stringify(drawings());
    if (current === lastSaved) { return; }
    lastSaved = current;
    pendingNonce = Date.now() + "-" + Math.random().toString(36).slice(2);
    setStatus("Lagrer tegninger …");
    send("streamlit:setComponentValue", {
      value: { ticker: ticker, nonce: pendingNonce, annotations: JSON.parse(current) },
      dataType: "json",
    });
  }

  document.addEventListener("mousedown", function () { mouseDown = true; }, true);
  document.addEventListener("mouseup", function () { mouseDown = false; }, true);
  document.addEventListener("touchstart", function () { mouseDown = true; }, true);
  document.addEventListener("touchend", function () { mouseDown = false; }, true);
  setInterval(autosave, 700);

  // Dra i datoaksen (under plottet) for å strekke/presse sammen stolpene. Høyre kant holdes fast,
  // som i TradingView: dra mot venstre = tettere, mot høyre = bredere.
  let axisDrag = null;
  function inXAxisArea(event) {
    if (!chart) { return false; }
    const rect = chart.container.getBoundingClientRect();
    const x = event.clientX - rect.left, y = event.clientY - rect.top;
    const bottom = chart.plotTop + chart.plotHeight;
    const axisHeight = chart.navigator && chart.navigator.top ? Math.max(8, chart.navigator.top - bottom - 6) : 28;
    return x >= chart.plotLeft && x <= chart.plotLeft + chart.plotWidth && y > bottom && y < bottom + axisHeight;
  }
  chartEl.addEventListener("mousemove", function (event) {
    if (axisDrag) { return; }
    chartEl.classList.toggle("axis-drag", inXAxisArea(event));
  });
  chartEl.addEventListener("mousedown", function (event) {
    if (event.button !== 0 || !inXAxisArea(event)) { return; }
    const axis = chart.xAxis[0];
    const ext = axis.getExtremes();
    axisDrag = { startX: event.clientX, min: ext.min, max: ext.max, dataMin: ext.dataMin };
    event.stopPropagation(); event.preventDefault();
  }, true);
  window.addEventListener("mousemove", function (event) {
    if (!axisDrag) { return; }
    const factor = Math.exp(-(event.clientX - axisDrag.startX) / 250);
    const range = Math.max(10 * 24 * 3600 * 1000, (axisDrag.max - axisDrag.min) * factor);
    const min = Math.max(axisDrag.dataMin, axisDrag.max - range);
    chart.xAxis[0].setExtremes(min, axisDrag.max, true, false);
  });
  window.addEventListener("mouseup", function () { if (axisDrag) { axisDrag = null; chartEl.classList.remove("axis-drag"); } });

  // Dra i kursaksen (høyre marg ved prispanelet) opp/ned for å panorere kursen. Shift + dra, eller
  // rullehjul over aksen, endrer skalaen (strekker/presser kursene). Aksen slutter da å skalere seg
  // automatisk; dobbeltklikk i samme område setter den tilbake til automatisk.
  let yDrag = null;
  function inYAxisArea(event) {
    if (!chart) { return false; }
    const rect = chart.container.getBoundingClientRect();
    const x = event.clientX - rect.left, y = event.clientY - rect.top;
    const axis = chart.yAxis[0];
    return x > chart.plotLeft + chart.plotWidth && x < chart.chartWidth && y >= axis.top && y <= axis.top + axis.len;
  }
  // Skalerer kursaksen med faktor rundt et punkt (i aksens egne enheter, log-aksen regnes i log10).
  function scaleYAxis(factor, aroundPx) {
    const axis = chart.yAxis[0];
    const ext = axis.getExtremes();
    const log = axis.logarithmic;
    const toA = log ? Math.log10 : function (v) { return v; };
    const fromA = log ? function (v) { return Math.pow(10, v); } : function (v) { return v; };
    const min = toA(ext.min), max = toA(ext.max);
    const anchor = aroundPx === undefined ? (min + max) / 2 : toA(axis.toValue(aroundPx, true));
    const newMin = anchor - (anchor - min) * factor, newMax = anchor + (max - anchor) * factor;
    if (log && newMin <= -6) { return; }
    axis.setExtremes(fromA(newMin), fromA(newMax), true, false);
  }
  chartEl.addEventListener("mousemove", function (event) {
    if (axisDrag || yDrag) { return; }
    chartEl.classList.toggle("yaxis-drag", inYAxisArea(event));
  });
  chartEl.addEventListener("mousedown", function (event) {
    if (event.button !== 0 || !inYAxisArea(event)) { return; }
    const ext = chart.yAxis[0].getExtremes();
    yDrag = { startY: event.clientY, min: ext.min, max: ext.max, scale: event.shiftKey };
    event.stopPropagation(); event.preventDefault();
  }, true);
  window.addEventListener("mousemove", function (event) {
    if (!yDrag) { return; }
    const axis = chart.yAxis[0];
    const dy = event.clientY - yDrag.startY;
    if (yDrag.scale) {
      // Dra nedover = strekk ut (større stolper), oppover = press sammen.
      const log = axis.logarithmic;
      const toA = log ? Math.log10 : function (v) { return v; };
      const fromA = log ? function (v) { return Math.pow(10, v); } : function (v) { return v; };
      const min = toA(yDrag.min), max = toA(yDrag.max), mid = (min + max) / 2;
      const factor = Math.exp(-dy / 200);
      axis.setExtremes(fromA(mid - (mid - min) * factor), fromA(mid + (max - mid) * factor), true, false);
    } else {
      const shift = dy / axis.len * (yDrag.max - yDrag.min);
      axis.setExtremes(yDrag.min + shift, yDrag.max + shift, true, false);
    }
  });
  window.addEventListener("mouseup", function () { if (yDrag) { yDrag = null; chartEl.classList.remove("yaxis-drag"); } });
  chartEl.addEventListener("dblclick", function (event) {
    if (inYAxisArea(event)) { chart.yAxis[0].setExtremes(null, null, true, false); event.stopPropagation(); }
  }, true);
  chartEl.addEventListener("wheel", function (event) {
    if (!inYAxisArea(event)) { return; }
    event.preventDefault(); event.stopPropagation();
    const rect = chart.container.getBoundingClientRect();
    scaleYAxis(Math.exp(event.deltaY / 300), event.clientY - rect.top);
  }, { passive: false, capture: true });

  // Lineær/logaritmisk kursakse. Valget huskes i nettleseren.
  const logButton = document.getElementById("logscale");
  function renderLogButton() { logButton.classList.toggle("on", logScale); logButton.textContent = logScale ? "Log ✓" : "Log"; }
  logButton.addEventListener("click", function () {
    logScale = !logScale;
    localStorage.setItem("chart_log", logScale ? "1" : "0");
    renderLogButton();
    if (chart) { chart.yAxis[0].update({ type: logScale ? "logarithmic" : "linear", min: null, max: null }, true); }
  });
  renderLogButton();

  // Bilde til notat: SVG fra Highcharts (med tegninger) rasteriseres til PNG i nettleseren og sendes
  // til Streamlit, som legger det klart ved neste notat på aksjesiden.
  const snapButton = document.getElementById("snapshot");
  function snapshot() {
    if (!chart) { return; }
    snapButton.disabled = true;
    setStatus("Lager bilde …");
    try {
      const width = chart.chartWidth, height = chart.chartHeight, scale = 2;
      const svg = chart.getSVG({ chart: { backgroundColor: chart.options.chart.backgroundColor } });
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width * scale; canvas.height = height * scale;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = chart.options.chart.backgroundColor || "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const png = canvas.toDataURL("image/png");
        send("streamlit:setComponentValue", {
          value: { ticker: ticker, nonce: "img-" + Date.now(), png: png }, dataType: "json",
        });
        setStatus("Bildet ligger klart ved notatskjemaet under chartet.");
        snapButton.disabled = false;
      };
      img.onerror = function () { setStatus("Kunne ikke lage bilde av chartet.", true); snapButton.disabled = false; };
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    } catch (error) {
      console.warn(error);
      setStatus("Kunne ikke lage bilde av chartet.", true);
      snapButton.disabled = false;
    }
  }
  snapButton.addEventListener("click", snapshot);

  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "streamlit:render") { onRender(event); }
  });
  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
